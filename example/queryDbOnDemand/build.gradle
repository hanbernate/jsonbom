// =============================================================================
// build.gradle — example:queryDbOnDemand
// =============================================================================

plugins {
    id 'java'
}
group   = rootProject.group
version = rootProject.version
description = 'Example: Query database on demand using jsonbom'

java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation rootProject
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.springframework:spring-context:6.2.18'
    implementation 'org.springframework:spring-jdbc:6.2.18'
    implementation 'org.springframework:spring-beans:6.2.18'
    implementation 'com.google.guava:guava:33.0.0-jre'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation group: 'io.projectreactor', name: 'reactor-core', version: '3.6.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'io.projectreactor:reactor-test:3.6.9'
}

test {
    useJUnitPlatform()
}
