// =============================================================================
// build.gradle — example:calculatePrice
// =============================================================================

description = 'Example: Calculate price using jsonbom'

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation rootProject
    implementation 'io.projectreactor:reactor-core:3.6.9'
    implementation 'org.springframework:spring-context:6.2.18'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.projectreactor:reactor-test:3.6.9'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
    testImplementation 'org.mockito:mockito-core:5.12.0'
}
