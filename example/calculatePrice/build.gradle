// =============================================================================
// build.gradle — example:calculatePrice
// =============================================================================

description = 'Example: Calculate price using jsonbom'

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation rootProject
    implementation 'io.projectreactor:reactor-core:3.6.9'
    implementation 'org.springframework:spring-context:6.2.18'
    implementation 'org.springframework:spring-aop:6.2.18'
    implementation 'org.aspectj:aspectjweaver:1.9.22.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.6'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.projectreactor:reactor-test:3.6.9'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.22.1'
    testImplementation 'org.springframework:spring-test:6.2.18'
    testImplementation 'ch.qos.logback:logback-classic:1.4.14'
}

compileTestJava {
    options.compilerArgs << '-parameters'
}
