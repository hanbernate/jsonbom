// =============================================================================
// build.gradle — example:calculatePrice
// =============================================================================
// This example runs as a Spring Boot WebFlux application so that the request BOM
// can be accepted over HTTP (POST /price/{goodsId}). The repositories keep fixed
// data; the real HTTP hop is exercised by the integration test, which calls the
// controller with a WebClient. The BOM JSON is read/written with Jackson 3
// (tools.jackson).
// =============================================================================

plugins {
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
}

description = 'Example: Calculate price using jsonbom'

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation rootProject
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Jackson 3 — the BOM is deserialized with tools.jackson.
    // The root project declares these as `implementation`, so they are not
    // visible on this project's compile classpath and must be re-declared.
    implementation platform('tools.jackson:jackson-bom:3.1.0')
    implementation 'tools.jackson.core:jackson-databind'

    implementation 'org.springframework:spring-aop:6.2.18'
    implementation 'org.aspectj:aspectjweaver:1.9.22.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test:3.6.9'
    testImplementation platform('tools.jackson:jackson-bom:3.1.0')
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.22.1'
    testImplementation 'org.springframework:spring-test:6.2.18'
}

compileTestJava {
    options.compilerArgs << '-parameters'
}
