// =============================================================================
// build.gradle — jsonbom
// =============================================================================

plugins {
    id 'java'
    id 'eclipse'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'jacoco'

    group   = rootProject.group
    version = rootProject.version

    java {
        sourceCompatibility = 17
        targetCompatibility = 17
    }

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }
}

ext {
    spring = [
            version : "6.2.19"
    ];
    springAi = [
            version : "2.0.1"
    ];
    slf4j = [
            version : "2.0.9"
    ];
    jackson = [
            version : '2.18.6'
    ];
    victools = [
            version : '5.0.0'
    ]
}

group   = 'io.github.hanbernate'
version = '0.2.0.rc2'
description = 'API Query Language with Json'

java {
    sourceCompatibility = 17
    targetCompatibility = 17
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    implementation(platform("tools.jackson:jackson-bom:3.1.0"))
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation group:'org.springframework.ai', name:'spring-ai-starter-mcp-server-webflux', version:springAi.version
    
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: jackson.version
    implementation group: 'io.projectreactor', name: 'reactor-core', version: '3.6.9'
    implementation group: 'org.springframework', name: 'spring-core', version: spring.version
    implementation group: 'org.springframework', name: 'spring-beans', version: spring.version
    implementation group: 'org.slf4j', name:'slf4j-api', version: slf4j.version
    implementation("tools.jackson.core:jackson-databind")
    compileOnly group: 'com.github.victools', name: 'jsonschema-generator', version: victools.version
}

test {
    useJUnitPlatform()
}

// ---- 应用 Maven Central 打包脚本 ---------------------------------------------
// 可用的 Gradle 任务:
//   gradle build                        → 编译
//   gradle publishToMavenLocal          → 发布到 ~/.m2 本地仓库
//   gradle assembleMavenCentral         → 收集所有产物到 build/maven-central/
//   gradle bundleForMavenCentral        → 一键执行上述两个任务
//   gradle verifyPublication            → 验证产物完整性
apply from: 'publish-to-maven-central.gradle'