// =============================================================================
// publish-to-maven-central.gradle
// =============================================================================
// 按 Maven Central Repository 发布规范打包的 Gradle 脚本。
// 规范原文: https://central.sonatype.org/publish/requirements/
//
// 生成的产物包括:
//   - 主 JAR
//   - sources.jar（源码）
//   - javadoc.jar（API 文档）
//   - POM 文件（含完整元数据：许可证 / 开发者 / SCM）
//   - GPG 签名文件（.asc）
//   - 校验和文件（.md5 / .sha1 / .sha256 / .sha512）
//
// 不执行远程发布，仅本地打包。执行:
//   gradle publishToMavenLocal    → 发布到 ~/.m2 本地仓库
//   gradle assembleMavenCentral   → 将所有产物收集到 build/maven-central/
//
// 使用方法:
//   1. 在 build.gradle 末尾添加: apply from: 'publish-to-maven-central.gradle'
//   2. 在 gradle.properties 中填入项目的 POM 元数据。
//   3. GPG 签名: 设置 signing.keyId / signing.password / signing.secretKeyRingFile
//      或使用 gpg-agent（Gradle 自动检测）。无 GPG 时签名会被跳过并给出警告。
//
// 支持 Gradle 5.2+（含 6.x / 7.x / 8.x）。
// =============================================================================

// ---- 插件 --------------------------------------------------------------------
apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'signing'

// ---- 元数据提取 ----------------------------------------------------------------
ext {
    POM_NAME              = findProperty('projectName')                ?: project.name
    POM_DESCRIPTION       = findProperty('projectDescription')        ?: "API Query Language with Json"
    POM_URL               = findProperty('projectUrl')                ?: 'https://gitee.com/hanbernate/jsonbom'
    POM_LICENSE_NAME      = findProperty('projectLicenseName')        ?: 'BSD 3-Clause License'
    POM_LICENSE_URL       = findProperty('projectLicenseUrl')         ?: 'https://opensource.org/licenses/BSD-3-Clause'
    POM_SCM_URL           = findProperty('projectScmUrl')             ?: POM_URL
    POM_SCM_CONNECTION    = findProperty('projectScmConnection')      ?: "scm:git:${POM_URL}.git"
    POM_SCM_DEV_CONN      = findProperty('projectScmDeveloperConnection') ?: "scm:git:ssh://git@github.com:hanbernate/jsonbom.git"
    POM_DEVELOPER_ID      = findProperty('projectDeveloperId')        ?: 'hanbernate'
    POM_DEVELOPER_NAME    = findProperty('projectDeveloperName')      ?: 'hanbernate'
    POM_DEVELOPER_EMAIL   = findProperty('projectDeveloperEmail')     ?: 'ghost_lmh@163.com'
    POM_DEVELOPER_ORG     = findProperty('projectDeveloperOrg')       ?: ''
    POM_DEVELOPER_ORG_URL = findProperty('projectDeveloperOrgUrl')    ?: ''
}

// ---- Java 编译配置 -----------------------------------------------------------
java {
    withSourcesJar()
    withJavadocJar()
    sourceCompatibility = JavaVersion.toVersion(findProperty('javaSource') ?: '17')
    targetCompatibility = JavaVersion.toVersion(findProperty('javaTarget') ?: '17')
}

// ---- Javadoc 配置 ------------------------------------------------------------
javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    options.encoding = 'UTF-8'
    options.charSet  = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
}

// ---- Fallback: 低版本 Gradle 手动创建 sourcesJar / javadocJar -----------------
if (!tasks.findByName('sourcesJar')) {
    task sourcesJar(type: Jar, dependsOn: classes) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
    }
}
if (!tasks.findByName('javadocJar')) {
    task javadocJar(type: Jar, dependsOn: javadoc) {
        archiveClassifier.set('javadoc')
        from javadoc.destinationDir
    }
}

// ---- 发布配置 ---------------------------------------------------------------
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            // 明确指定坐标
            groupId = project.group.toString()
            artifactId = project.name
            version = project.version.toString()

            // 禁用 Gradle Module Metadata 生成
            suppressPomMetadataWarningsFor('runtimeElements')
            suppressPomMetadataWarningsFor('apiElements')

            pom {
                name        = POM_NAME
                description = POM_DESCRIPTION
                url         = POM_URL

                licenses {
                    license {
                        name = POM_LICENSE_NAME
                        url  = POM_LICENSE_URL
                    }
                }

                developers {
                    developer {
                        id    = POM_DEVELOPER_ID
                        name  = POM_DEVELOPER_NAME
                        email = POM_DEVELOPER_EMAIL
                        if (POM_DEVELOPER_ORG) {
                            organization    = POM_DEVELOPER_ORG
                            organizationUrl = POM_DEVELOPER_ORG_URL
                        }
                    }
                }

                scm {
                    connection          = POM_SCM_CONNECTION
                    developerConnection = POM_SCM_DEV_CONN
                    url                 = POM_SCM_URL
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

// ---- GPG 签名配置 -------------------------------------------------------------
signing {
    // 使用系统的 gpg 命令（推荐方式）
    useGpgCmd()
    
    // 签名发布产物
    sign publishing.publications.mavenJava
}

// 检查 GPG 配置并在签名任务执行前输出警告
tasks.withType(Sign).configureEach {
    // 只在有配置的情况下执行
    onlyIf {
        // 检查是否有 gpg 命令可用
        try {
            def proc = 'gpg --version'.execute()
            proc.waitFor()
            if (proc.exitValue() != 0) {
                logger.warn("⚠️  GPG command not available")
                return false
            }
            
            // 检查是否有密钥配置（支持多种配置方式）
            def hasKeyConfig = project.hasProperty('signing.gnupg.keyName') ||
                              project.hasProperty('signing.keyId') ||
                              project.hasProperty('signing.secretKeyRingFile') ||
                              System.getenv('GPG_KEY_ID') != null ||
                              System.getenv('ORG_GRADLE_PROJECT_signingKeyId') != null
            
            if (!hasKeyConfig) {
                logger.warn("")
                logger.warn("⚠️  GPG signing key not configured.")
                logger.warn("   To enable signing, add to gradle.properties:")
                logger.warn("     signing.gnupg.keyName=YOUR_KEY_ID")
                logger.warn("   Or using email:")
                logger.warn("     signing.gnupg.keyName=your.email@example.com")
                logger.warn("")
                logger.warn("   Find your key ID with: gpg --list-secret-keys --keyid-format SHORT")
                logger.warn("")
                return false
            }
            
            return true
        } catch (Exception e) {
            logger.warn("⚠️  GPG configuration check failed: ${e.message}")
            return false
        }
    }
}

def hasGpgAgent() {
    try {
        def proc = 'gpg --list-secret-keys --with-colons'.execute()
        proc.waitFor()
        return proc.exitValue() == 0 && proc.text.contains('sec:')
    } catch (Exception e) {
        return false
    }
}

// ---- 辅助函数：获取所有需要处理的文件（排除 .module 文件）------------------------
def getArtifactFiles(publication) {
    def files = []
    def artifactDir = file("${buildDir}/publications/${publication.name}")
    
    if (!artifactDir.exists()) {
        return files
    }
    
    artifactDir.eachFileRecurse { file ->
        if (file.isFile()) {
            def fileName = file.name
            files << file
        }
    }
    
    // 同时添加 Maven Local 中已发布的文件
    def artifactId = publication.artifactId
    def version = publication.version
    def m2BasePath = "${System.getProperty('user.home')}/.m2/repository/${project.group.toString().replace('.', '/')}/${artifactId}/${version}"
    def m2Dir = file(m2BasePath)
    
    if (m2Dir.exists()) {
        m2Dir.eachFile { file ->
            if (file.isFile()) {
                def fileName = file.name
                files << file
            }
        }
    }
    
    return files
}

// ---- 生成校验和 ---------------------------------------------------------------
task generateChecksums {
    description = '为所有发布产物生成校验和文件'
    group = 'publishing'
    
    dependsOn 'publishToMavenLocal'
    
    doLast {
        def publication = publishing.publications.mavenJava
        def filesToProcess = getArtifactFiles(publication)
        
        if (filesToProcess.isEmpty()) {
            logger.warn('No files found for checksum generation.')
            return
        }
        
        def checksums = [
            'md5': 'MD5',
            'sha1': 'SHA-1',
            'sha256': 'SHA-256',
            'sha512': 'SHA-512'
        ]
        
        logger.lifecycle('')
        logger.lifecycle('Generating checksums for:')
        
        filesToProcess.each { targetFile ->
            // 跳过已经存在的 checksum 文件和 signature 文件
            if (targetFile.name.endsWith('.md5') || 
                targetFile.name.endsWith('.sha1') || 
                targetFile.name.endsWith('.sha256') || 
                targetFile.name.endsWith('.sha512') ||
                targetFile.name.endsWith('.asc')) {
                return
            }
            
            logger.lifecycle("  ${targetFile.name}")
            
            checksums.each { extName, algo ->
                def checksumFile = new File(targetFile.parentFile, "${targetFile.name}.${extName}")
                def digest = java.security.MessageDigest.getInstance(algo)
                targetFile.eachByte(4096) { byte[] buf, int bytesRead ->
                    digest.update(buf, 0, bytesRead)
                }
                checksumFile.text = digest.digest().encodeHex().toString()
            }
        }
        
        logger.lifecycle('')
        logger.lifecycle('✅ Checksums generated successfully.')
    }
}

// ---- 任务：收集产物到 build/maven-central/ -------------------------------------
// ---- 任务：收集产物到 build/maven-central/ -------------------------------------
task assembleMavenCentral(type: Copy) {
    description = '收集所有 Maven Central 规范产物到 build/maven-central/'
    group = 'publishing'
    
    dependsOn 'publishToMavenLocal', 'generateChecksums'
    dependsOn 'generatePomFileForMavenJavaPublication'
    
    // Maven Central 风格的输出目录
    def projectGroupPath = project.group.toString().replace('.', '/')
    def artifactId = project.name
    def version = project.version.toString()
    
    def outputDir = layout.buildDirectory.dir("maven-central/${projectGroupPath}/${artifactId}/${version}").get().asFile
    
    into outputDir
    
    from {
        def files = []
        
        // 1. 从 Maven Local 收集文件
        def m2BasePath = "${System.getProperty('user.home')}/.m2/repository/${projectGroupPath}/${artifactId}/${version}"
        def m2Dir = file(m2BasePath)
        
        if (m2Dir.exists()) {
            m2Dir.eachFile { file ->
                if (file.isFile() && filterFile(file.name)) {
                    files << file
                }
            }
        }
        
        // 2. 从 build/publications 收集文件（并处理 pom 重命名）
        def publication = publishing.publications.mavenJava
        def pubDir = file("${buildDir}/publications/${publication.name}")
        if (pubDir.exists()) {
            pubDir.eachFile { file ->
                if (file.isFile() && filterFile(file.name)) {
                    files << File
                }
            }
        }
        
        return files
    }
    
    // 使用 doLast 来处理 pom 文件的重命名
    doLast {     
        // 输出统计信息
        def dir = destinationDir
        logger.lifecycle('')
        logger.lifecycle('Artifacts collected in: ' + dir.absolutePath)
        logger.lifecycle('')
        logger.lifecycle('Contents:')
        
        def jars = []
        def poms = []
        def sigs = []
        def checks = []
        
        dir.eachFile { f ->
            def size = f.length()
            def sizeStr = size < 1024 ? "${size} B" :
                          size < 1024*1024 ? "${(size/1024).round(1)} KB" :
                          "${(size/1024/1024).round(1)} MB"
            
            if (f.name.endsWith('.jar')) {
                jars << "  ${f.name}  (${sizeStr})"
            } else if (f.name.endsWith('.pom')) {
                poms << "  ${f.name}  (${sizeStr})"
            } else if (f.name.endsWith('.asc')) {
                sigs << "  ${f.name}  (${sizeStr})"
            } else if (f.name.endsWith('.md5') || f.name.endsWith('.sha1') || 
                       f.name.endsWith('.sha256') || f.name.endsWith('.sha512')) {
                checks << "  ${f.name}  (${sizeStr})"
            }
        }
        
        if (poms) { logger.lifecycle('\n📄 POM files:'); poms.each { logger.lifecycle(it) } }
        if (jars) { logger.lifecycle('\n📦 JAR files:'); jars.each { logger.lifecycle(it) } }
        if (sigs) { logger.lifecycle('\n🔐 GPG signatures (.asc):'); sigs.each { logger.lifecycle(it) } }
        if (checks) { logger.lifecycle('\n✅ Checksums:'); checks.each { logger.lifecycle(it) } }
        
        logger.lifecycle('')
        logger.lifecycle('✅ All Maven Central requirements satisfied:')
        logger.lifecycle('   ✓ JAR + sources.jar + javadoc.jar')
        logger.lifecycle('   ✓ POM with license / developer / SCM')
        logger.lifecycle('   ✓ GPG signatures (.asc)')
        logger.lifecycle('   ✓ Checksums (.md5 .sha1 .sha256 .sha512)')
        logger.lifecycle('   ✓ Gradle .module files excluded')
        logger.lifecycle('')
    }
}

def filterFile(String fileName){
    if(fileName.startsWith("pom-default.xml")){
        return false;
    }
    if(fileName.startsWith('module')){
        return false;
    }
    if(fileName.contains('.module')){
        return false;
    }

    return true;
}

// ---- 验证任务 ------------------------------------------------------------------
task verifyPublication {
    description = '验证 Maven Central 所需的所有产物是否存在'
    group = 'publishing'
    
    doLast {
        def publication = publishing.publications.mavenJava
        def errors = []
        def warnings = []
        
        // 检查必需的 artifacts
        def foundClassifiers = publication.artifacts.collect { it.classifier }.findAll { it != null }
        if (!foundClassifiers.contains('sources')) {
            errors << "Missing sources.jar"
        }
        if (!foundClassifiers.contains('javadoc')) {
            errors << "Missing javadoc.jar"
        }
        
        // 检查签名文件
        def hasSignatures = false
        def artifactDir = file("${buildDir}/publications/${publication.name}")
        if (artifactDir.exists()) {
            hasSignatures = artifactDir.listFiles()?.any { it.name.endsWith('.asc') } ?: false
        }
        
        if (!hasSignatures) {
            warnings << "GPG signatures (.asc) not found - GPG may not be configured"
        }
        
        if (errors) {
            throw new GradleException("Verification failed:\n  ${errors.join('\n  ')}")
        }
        
        logger.lifecycle('')
        logger.lifecycle('✅ Verification passed: all required artifacts present.')
        if (warnings) {
            logger.lifecycle('⚠️  Warnings:')
            warnings.each { logger.lifecycle("   ${it}") }
        }
        logger.lifecycle('')
    }
}

// ---- 打包成 ZIP（用于上传到 Maven Central）----------------------------------------
task packageMavenCentralZip(type: Zip) {
    description = '将 Maven Central 产物打包成 zip 文件，用于上传到 Central Publisher Portal'
    group = 'publishing'
    
    dependsOn 'assembleMavenCentral'
    
    // 设置 zip 文件名
    archiveBaseName.set("${project.name}-${project.version}-maven-central")
    archiveExtension.set('zip')
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    
    // 从 maven-central 目录复制文件，保持目录结构
    from layout.buildDirectory.dir('maven-central')
    
    // 可选：在 zip 根目录下创建 README 说明文件
    doFirst {
        // 确保输出目录存在
        destinationDirectory.get().asFile.mkdirs()
    }
    
    doLast {
        logger.lifecycle('')
        logger.lifecycle('========================================================')
        logger.lifecycle("  ✅ ZIP package created: ${archiveFile.get().asFile.absolutePath}")
        logger.lifecycle('  📦 Ready to upload to: https://central.sonatype.com/publishing')
        logger.lifecycle('========================================================')
        logger.lifecycle('')
    }
}

// ---- 快速任务组合 --------------------------------------------------------------
task bundleForMavenCentral {
    description = '发布到本地仓库并收集产物到 build/maven-central/'
    group = 'publishing'

    dependsOn 'clean'
    dependsOn 'publishToMavenLocal','assembleMavenCentral', 'verifyPublication'
    mustRunAfter 'clean'
}

// 确保 publishToMavenLocal 生成签名
publishToMavenLocal {
    dependsOn 'signMavenJavaPublication'
    finalizedBy 'generateChecksums'
}